[project]
name = "unlink-api"
version = "0.1.0"
description = "Unlink: workforce reduction planning API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "python-multipart>=0.0.9",
    "anthropic>=2.1.0",
    "weasyprint>=70.0",
    "jinja2>=3.1.6",
    "pyotp>=2.10.0",
    "cryptography>=50.0.2",
    "pypdf>=6.21.2",
    "pyyaml>=6.0.3",
    "qrcode>=7",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
